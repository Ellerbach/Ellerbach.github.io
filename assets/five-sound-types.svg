<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">The five renderer sound types</title>
  <desc id="desc">Five panels compare periodic voiced sound, noisy fricatives, mixed voiced fricatives, closure and burst stops, and centered silence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1100" height="500" rx="24" fill="url(#bg)"/>
  <text x="45" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Five different ways to make one stream of samples</text>
  <text x="45" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">The phoneme type selects the excitation and timing recipe.</text>

  <g font-family="Segoe UI,Arial,sans-serif" transform="translate(35 115)">
    <g transform="translate(0)" filter="url(#shadow)"><rect width="190" height="325" rx="18" fill="#fff"/></g>
    <rect width="190" height="8" rx="4" fill="#e11d48"/>
    <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#be123c">Voiced</text>
    <text x="95" y="67" text-anchor="middle" font-size="14" fill="#64748b">vowels, m, n, l</text>
    <path d="M18 140 C34 90 50 90 66 140 S98 190 114 140 S146 90 172 140" fill="none" stroke="#e11d48" stroke-width="5"/>
    <path d="M18 115 C50 105 76 126 107 112 S151 99 172 115" fill="none" stroke="#fda4af" stroke-width="3"/>
    <text x="95" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">periodic source</text>
    <text x="95" y="249" text-anchor="middle" font-size="14" fill="#64748b">+</text>
    <text x="95" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">formant components</text>
    <rect x="25" y="292" width="140" height="23" rx="11" fill="#ffe4e6"/>
    <text x="95" y="309" text-anchor="middle" font-size="13" fill="#be123c">repeating and tonal</text>

    <g transform="translate(210)" filter="url(#shadow)"><rect width="190" height="325" rx="18" fill="#fff"/></g>
    <g transform="translate(210)">
      <rect width="190" height="8" rx="4" fill="#f59e0b"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Fricative</text>
      <text x="95" y="67" text-anchor="middle" font-size="14" fill="#64748b">f, s, sh</text>
      <path d="M18 138 L27 112 L36 157 L45 96 L54 166 L63 121 L72 149 L81 104 L90 161 L99 118 L108 151 L117 91 L126 169 L135 109 L144 155 L153 101 L172 138" fill="none" stroke="#f59e0b" stroke-width="4"/>
      <text x="95" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">shaped noise</text>
      <text x="95" y="249" text-anchor="middle" font-size="14" fill="#64748b">low, broad, or sharp</text>
      <rect x="25" y="292" width="140" height="23" rx="11" fill="#fef3c7"/>
      <text x="95" y="309" text-anchor="middle" font-size="13" fill="#92400e">turbulent and airy</text>
    </g>

    <g transform="translate(420)" filter="url(#shadow)"><rect width="190" height="325" rx="18" fill="#fff"/></g>
    <g transform="translate(420)">
      <rect width="190" height="8" rx="4" fill="#7c3aed"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">Voiced fricative</text>
      <text x="95" y="67" text-anchor="middle" font-size="14" fill="#64748b">v, z, French j</text>
      <path d="M18 140 C34 105 50 105 66 140 S98 175 114 140 S146 105 172 140" fill="none" stroke="#7c3aed" stroke-width="5"/>
      <path d="M18 137 L29 119 L40 154 L51 124 L62 158 L73 122 L84 150 L95 126 L106 154 L117 121 L128 159 L139 124 L150 151 L161 120 L172 137" fill="none" stroke="#c4b5fd" stroke-width="3"/>
      <text x="95" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">periodic + noise</text>
      <text x="95" y="249" text-anchor="middle" font-size="14" fill="#64748b">two sources mixed</text>
      <rect x="25" y="292" width="140" height="23" rx="11" fill="#ede9fe"/>
      <text x="95" y="309" text-anchor="middle" font-size="13" fill="#5b21b6">buzzing turbulence</text>
    </g>

    <g transform="translate(630)" filter="url(#shadow)"><rect width="190" height="325" rx="18" fill="#fff"/></g>
    <g transform="translate(630)">
      <rect width="190" height="8" rx="4" fill="#2563eb"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Stop</text>
      <text x="95" y="67" text-anchor="middle" font-size="14" fill="#64748b">p, t, k, b, d, g</text>
      <line x1="18" y1="140" x2="107" y2="140" stroke="#94a3b8" stroke-width="4"/>
      <path d="M107 140 L114 88 L121 176 L128 105 L135 160 L142 119 L149 151 L156 129 L172 140" fill="none" stroke="#2563eb" stroke-width="5"/>
      <text x="60" y="174" text-anchor="middle" font-size="13" fill="#64748b">closure</text>
      <text x="139" y="197" text-anchor="middle" font-size="13" fill="#1d4ed8">burst</text>
      <text x="95" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">silence, then release</text>
      <text x="95" y="249" text-anchor="middle" font-size="14" fill="#64748b">optional voiced murmur</text>
      <rect x="25" y="292" width="140" height="23" rx="11" fill="#dbeafe"/>
      <text x="95" y="309" text-anchor="middle" font-size="13" fill="#1e40af">a timed event</text>
    </g>

    <g transform="translate(840)" filter="url(#shadow)"><rect width="190" height="325" rx="18" fill="#fff"/></g>
    <g transform="translate(840)">
      <rect width="190" height="8" rx="4" fill="#64748b"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Silence</text>
      <text x="95" y="67" text-anchor="middle" font-size="14" fill="#64748b">spaces, punctuation</text>
      <line x1="18" y1="140" x2="172" y2="140" stroke="#64748b" stroke-width="5"/>
      <circle cx="95" cy="140" r="7" fill="#334155"/>
      <text x="95" y="174" text-anchor="middle" font-size="13" fill="#64748b">PCM center = 128</text>
      <text x="95" y="225" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">timed pause</text>
      <text x="95" y="249" text-anchor="middle" font-size="14" fill="#64748b">rhythm still continues</text>
      <rect x="25" y="292" width="140" height="23" rx="11" fill="#e2e8f0"/>
      <text x="95" y="309" text-anchor="middle" font-size="13" fill="#334155">quiet, not empty</text>
    </g>
  </g>
</svg>
