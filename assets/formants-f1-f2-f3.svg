<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Visual guide to F1, F2, and F3</title>
  <desc id="description">A speech spectrum with peaks at 657, 1310, and 2440 hertz, followed by panels explaining that F1 relates to mouth opening, F2 to tongue position, and F3 to upper spectral character.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="620" rx="24" fill="url(#background)"/>
  <text x="50" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Formants are locations on the frequency axis</text>
  <text x="50" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Example: the three targets used by the French A phoneme</text>

  <g transform="translate(70 115)">
    <line x1="0" y1="235" x2="860" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="0" y1="235" x2="0" y2="15" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="785" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">frequency (Hz)</text>
    <text x="-18" y="5" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">energy</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
      <line x1="0" y1="235" x2="0" y2="242" stroke="#64748b"/>
      <text x="0" y="260">0</text>
      <line x1="215" y1="235" x2="215" y2="242" stroke="#64748b"/>
      <text x="215" y="260">1000</text>
      <line x1="430" y1="235" x2="430" y2="242" stroke="#64748b"/>
      <text x="430" y="260">2000</text>
      <line x1="645" y1="235" x2="645" y2="242" stroke="#64748b"/>
      <text x="645" y="260">3000</text>
      <line x1="860" y1="235" x2="860" y2="242" stroke="#64748b"/>
      <text x="860" y="260">4000</text>
    </g>

    <path d="M0 225
             C65 223, 89 215, 110 180
             C125 154, 129 70, 141 42
             C153 72, 154 145, 168 177
             C194 218, 245 217, 270 188
             C279 171, 274 105, 282 78
             C291 107, 292 173, 307 197
             C305 226, 425 220, 500 213
             C514 201, 515 151, 525 123
             C537 153, 536 203, 554 216
             C635 224, 760 226, 860 226"
          fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>

    <line x1="141" y1="42" x2="141" y2="235" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="141" cy="42" r="7" fill="#e11d48"/>
    <rect x="89" y="4" width="104" height="34" rx="17" fill="#ffe4e6"/>
    <text x="141" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#be123c" text-anchor="middle">F1 657 Hz</text>

    <line x1="282" y1="78" x2="282" y2="235" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="282" cy="78" r="7" fill="#2563eb"/>
    <rect x="224" y="39" width="116" height="34" rx="17" fill="#dbeafe"/>
    <text x="282" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">F2 1310 Hz</text>

    <line x1="525" y1="123" x2="525" y2="235" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="525" cy="123" r="7" fill="#7c3aed"/>
    <rect x="467" y="84" width="116" height="34" rx="17" fill="#ede9fe"/>
    <text x="525" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">F3 2440 Hz</text>
  </g>

  <g transform="translate(50 425)" font-family="Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect width="285" height="150" rx="18" fill="#fff"/>
      <rect width="8" height="150" rx="4" fill="#e11d48"/>
    </g>
    <text x="28" y="35" font-size="22" font-weight="700" fill="#be123c">F1</text>
    <text x="28" y="64" font-size="17" font-weight="600" fill="#0f172a">Mouth opening / vowel height</text>
    <path d="M45 101 Q85 70 125 101 Q85 132 45 101 Z" fill="none" stroke="#e11d48" stroke-width="5"/>
    <path d="M162 112 Q202 79 242 112" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <text x="28" y="140" font-size="14" fill="#64748b">open mouth usually means higher F1</text>
  </g>

  <g transform="translate(357 425)" font-family="Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect width="285" height="150" rx="18" fill="#fff"/>
      <rect width="8" height="150" rx="4" fill="#2563eb"/>
    </g>
    <text x="28" y="35" font-size="22" font-weight="700" fill="#1d4ed8">F2</text>
    <text x="28" y="64" font-size="17" font-weight="600" fill="#0f172a">Tongue front/back position</text>
    <path d="M38 117 C52 75, 108 72, 127 110 C91 93, 66 97, 38 117 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
    <path d="M160 117 C176 92, 226 72, 250 110 C215 91, 190 97, 160 117 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="28" y="140" font-size="14" fill="#64748b">front tongue usually means higher F2</text>
  </g>

  <g transform="translate(664 425)" font-family="Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect width="285" height="150" rx="18" fill="#fff"/>
      <rect width="8" height="150" rx="4" fill="#7c3aed"/>
    </g>
    <text x="28" y="35" font-size="22" font-weight="700" fill="#6d28d9">F3</text>
    <text x="28" y="64" font-size="17" font-weight="600" fill="#0f172a">Upper spectral character</text>
    <path d="M35 116 C66 116, 71 108, 88 108 C106 108, 108 90, 124 90 C140 90, 144 111, 165 111 C188 111, 193 74, 211 74 C229 74, 232 113, 255 113" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <text x="28" y="140" font-size="14" fill="#64748b">adds brightness and identity cues</text>
  </g>
</svg>
